
<style>
#erd-wrap { width: 100%; overflow-x: auto; }
#erd svg { min-width: 900px; }
#erd svg.erDiagram .divider path { stroke-opacity: 0.4; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
.legend-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 10px; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-secondary); }
.ldot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
.key-legend { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 14px; }
.kl { font-size: 11px; color: var(--color-text-tertiary); }
</style>
<div class="legend-row">
  <div class="leg"><div class="ldot" style="background:#1F6FEB"></div>Nhóm người dùng</div>
  <div class="leg"><div class="ldot" style="background:#0F766E"></div>Nhóm xe cộ</div>
  <div class="leg"><div class="ldot" style="background:#D97706"></div>Nhóm đặt xe (trung tâm)</div>
  <div class="leg"><div class="ldot" style="background:#7C3AED"></div>Nhóm thanh toán</div>
  <div class="leg"><div class="ldot" style="background:#16A34A"></div>Nhóm tương tác</div>
</div>
<div class="key-legend">
  <span class="kl">PK = Khóa chính</span>
  <span class="kl">FK = Khóa ngoại</span>
  <span class="kl">||--o{ = Một-nhiều</span>
  <span class="kl">||--|| = Một-một</span>
</div>
<div id="erd-wrap"><div id="erd"></div></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#64748b',
    textColor: dark ? '#c2c0b6' : '#1e293b',
    primaryColor: dark ? '#1e3a5f' : '#EFF6FF',
    primaryTextColor: dark ? '#bfdbfe' : '#1e3a5f',
    primaryBorderColor: dark ? '#3b82f6' : '#3b82f6',
    secondaryColor: dark ? '#134e4a' : '#F0FDF4',
    secondaryTextColor: dark ? '#99f6e4' : '#134e4a',
    secondaryBorderColor: dark ? '#0f766e' : '#0f766e',
    tertiaryColor: dark ? '#3b0764' : '#FAF5FF',
    tertiaryTextColor: dark ? '#e9d5ff' : '#3b0764',
    tertiaryBorderColor: dark ? '#7c3aed' : '#7c3aed',
    nodeBorder: dark ? '#475569' : '#cbd5e1',
    clusterBkg: dark ? '#0f172a' : '#f8fafc',
    titleColor: dark ? '#f1f5f9' : '#0f172a',
    edgeLabelBackground: dark ? '#1e293b' : '#f8fafc',
    attributeBackgroundColorEven: dark ? '#1e293b' : '#f8fafc',
    attributeBackgroundColorOdd: dark ? '#0f172a' : '#ffffff',
  },
});

const diagram = `erDiagram
  users {
    UUID id PK
    VARCHAR email UK
    VARCHAR password_hash
    VARCHAR full_name
    VARCHAR phone UK
    VARCHAR role
    VARCHAR status
    INTEGER loyalty_points
    VARCHAR tier
    TIMESTAMPTZ created_at
  }

  user_documents {
    UUID id PK
    UUID user_id FK
    VARCHAR doc_type
    VARCHAR doc_number
    TEXT front_url
    TEXT back_url
    DATE expires_at
    BOOLEAN verified
    UUID verified_by FK
  }

  refresh_tokens {
    UUID id PK
    UUID user_id FK
    TEXT token_hash
    TEXT device_info
    TIMESTAMPTZ expires_at
    BOOLEAN revoked
  }

  vehicle_categories {
    UUID id PK
    VARCHAR name UK
    TEXT description
    NUMERIC base_price_day
    NUMERIC base_price_hour
    DECIMAL deposit_rate
    BOOLEAN is_active
  }

  vehicles {
    UUID id PK
    UUID category_id FK
    VARCHAR license_plate UK
    VARCHAR brand
    VARCHAR model
    SMALLINT year
    VARCHAR color
    SMALLINT seats
    VARCHAR fuel_type
    VARCHAR transmission
    INTEGER current_odometer
    UUID location_id FK
    VARCHAR status
    DECIMAL avg_rating
    INTEGER total_trips
    TIMESTAMPTZ created_at
  }

  vehicle_images {
    UUID id PK
    UUID vehicle_id FK
    TEXT url
    BOOLEAN is_primary
    SMALLINT display_order
  }

  locations {
    UUID id PK
    VARCHAR name UK
    TEXT address
    VARCHAR city
    DECIMAL latitude
    DECIMAL longitude
    VARCHAR phone
    TIME open_time
    TIME close_time
    BOOLEAN is_active
  }

  bookings {
    UUID id PK
    VARCHAR booking_code UK
    UUID customer_id FK
    UUID vehicle_id FK
    UUID pickup_location_id FK
    UUID return_location_id FK
    TIMESTAMPTZ start_datetime
    TIMESTAMPTZ end_datetime
    TIMESTAMPTZ actual_return_at
    INTEGER total_days
    NUMERIC base_amount
    NUMERIC discount_amount
    NUMERIC extra_amount
    NUMERIC total_amount
    NUMERIC deposit_amount
    VARCHAR status
    UUID promotion_id FK
    UUID staff_checkin_id FK
    UUID staff_checkout_id FK
    TEXT customer_note
    TEXT cancel_reason
    INTEGER version
    TIMESTAMPTZ created_at
  }

  checkin_reports {
    UUID id PK
    UUID booking_id FK
    VARCHAR report_type
    UUID staff_id FK
    INTEGER odometer
    SMALLINT fuel_level
    TEXT condition_notes
    BOOLEAN damage_found
    TEXT image_urls
    BOOLEAN customer_signed
    TIMESTAMPTZ reported_at
  }

  payments {
    UUID id PK
    UUID booking_id FK
    UUID customer_id FK
    VARCHAR type
    NUMERIC amount
    VARCHAR gateway
    VARCHAR gateway_txn_id UK
    VARCHAR idempotency_key UK
    VARCHAR status
    TIMESTAMPTZ paid_at
    TIMESTAMPTZ expires_at
    JSONB raw_response
    TIMESTAMPTZ created_at
  }

  promotions {
    UUID id PK
    VARCHAR code UK
    VARCHAR name
    VARCHAR discount_type
    NUMERIC discount_value
    NUMERIC max_discount
    NUMERIC min_order_value
    INTEGER usage_limit
    INTEGER usage_per_user
    INTEGER used_count
    TIMESTAMPTZ valid_from
    TIMESTAMPTZ valid_until
    BOOLEAN is_active
  }

  coupon_usages {
    UUID id PK
    UUID promotion_id FK
    UUID user_id FK
    UUID booking_id FK
    NUMERIC discount_applied
    TIMESTAMPTZ used_at
  }

  reviews {
    UUID id PK
    UUID booking_id FK
    UUID customer_id FK
    UUID vehicle_id FK
    SMALLINT overall_rating
    SMALLINT vehicle_rating
    SMALLINT service_rating
    TEXT comment
    BOOLEAN is_visible
    TEXT staff_reply
    UUID replied_by FK
    TIMESTAMPTZ created_at
  }

  notifications {
    UUID id PK
    UUID user_id FK
    VARCHAR type
    VARCHAR title
    TEXT body
    JSONB data
    BOOLEAN is_read
    TIMESTAMPTZ created_at
  }

  users ||--o{ user_documents : "co giay to"
  users ||--o{ refresh_tokens : "dang nhap"
  users ||--o{ bookings : "dat xe"
  users ||--o{ payments : "thanh toan"
  users ||--o{ coupon_usages : "dung ma giam"
  users ||--o{ reviews : "viet danh gia"
  users ||--o{ notifications : "nhan thong bao"
  vehicle_categories ||--o{ vehicles : "phan loai"
  vehicles ||--o{ vehicle_images : "co anh"
  vehicles ||--o{ bookings : "duoc dat"
  vehicles ||--o{ reviews : "duoc danh gia"
  locations ||--o{ vehicles : "dau xe tai"
  locations ||--o{ bookings : "nhan xe tai"
  bookings ||--o{ checkin_reports : "bien ban"
  bookings ||--o{ payments : "thanh toan"
  bookings ||--o{ coupon_usages : "ap dung ma"
  bookings ||--o{ reviews : "sau hoan thanh"
  promotions ||--o{ coupon_usages : "duoc su dung"
`;

const { svg } = await mermaid.render('erd-main', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});

const svgEl = document.querySelector('#erd svg');
if (svgEl) { svgEl.style.width = '100%'; svgEl.style.height = 'auto'; }
</script>
